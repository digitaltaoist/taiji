<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taiji">
<title>Taiji Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --jade:#2d6a4f;
    --jade-mid:#40916c;
    --jade-light:#74c69d;
    --jade-pale:#d8f3dc;
    --jade-faint:#f0faf3;
    --ink:#1a1f2e;
    --ink-mid:#3d4455;
    --ink-soft:#6b7280;
    --border:#d4e2db;
    --bg:#f4f7f5;
    --bg-card:#ffffff;
    --amber:#b45309;
    --amber-pale:#fef3c7;
    --red:#c0392b;
    --red-pale:#fdecea;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:90px;font-size:17px}

  /* ── TOP BAR ── */
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;
    background:linear-gradient(135deg,var(--jade) 0%,var(--jade-mid) 100%);
    position:sticky;top:0;z-index:50;
    box-shadow:0 2px 12px rgba(45,106,79,.35);
    gap:10px;
  }
  .top-bar h1{
    font-family:'Noto Serif SC',serif;
    font-size:19px;font-weight:700;
    color:#fff;letter-spacing:.02em;
    flex:1;
  }
  .top-bar-btns{display:flex;gap:8px;flex-shrink:0}

  /* Large labelled header buttons */
  .hdr-btn{
    background:rgba(255,255,255,.18);
    border:1.5px solid rgba(255,255,255,.4);
    border-radius:12px;
    padding:8px 13px;
    font-size:13px;font-weight:700;
    cursor:pointer;color:#fff;line-height:1.2;
    transition:background .15s;
    min-height:48px;min-width:52px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-family:'DM Sans',sans-serif;
  }
  .hdr-btn:active{background:rgba(255,255,255,.34)}
  .hdr-btn-icon{font-size:20px;line-height:1}
  .hdr-btn-label{font-size:11px;font-weight:600;letter-spacing:.02em;opacity:.92}

  /* Back / edit icon buttons (inside sub-screens) */
  .icon-btn{
    background:rgba(255,255,255,.18);
    border:1.5px solid rgba(255,255,255,.4);
    border-radius:12px;padding:10px 16px;
    font-size:17px;font-weight:600;cursor:pointer;color:#fff;line-height:1;
    transition:background .15s;
    min-height:48px;
    display:flex;align-items:center;justify-content:center;gap:5px;
    font-family:'DM Sans',sans-serif;
  }
  .icon-btn:active{background:rgba(255,255,255,.32)}
  .icon-btn.dark{
    background:rgba(26,31,46,.08);
    border:1.5px solid var(--border);
    color:var(--jade);
  }
  .icon-btn.dark:active{background:var(--jade-pale)}

  /* ── TAB BAR ── */
  .tab-bar{
    display:flex;background:var(--bg-card);
    border-bottom:1px solid var(--border);
    position:sticky;top:73px;z-index:40;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
  }
  .tab{
    flex:1;padding:13px 4px;text-align:center;
    font-size:13px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;
    border-bottom:3px solid transparent;
    letter-spacing:.03em;text-transform:uppercase;
    transition:color .15s;
  }
  .tab.active{color:var(--jade);border-bottom:3px solid var(--jade)}

  /* ── CONTENT ── */
  .content{padding:16px;max-width:480px;margin:0 auto}

  /* ── CARDS ── */
  .card{
    background:var(--bg-card);
    border-radius:14px;
    border:1px solid var(--border);
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 1px 6px rgba(45,106,79,.07);
  }
  .card-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 16px;
    border-bottom:1px solid var(--bg);
    cursor:pointer;transition:background .12s;
  }
  .card-row:last-child{border-bottom:none}
  .card-row:active{background:var(--jade-faint)}
  .card-title{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .card-sub{font-size:14px;color:var(--ink-soft)}
  .chevron{color:var(--jade-light);font-size:22px;font-weight:700}

  /* ── STAT GRID ── */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat-card{
    background:var(--bg-card);border-radius:12px;padding:15px 16px;
    border:1px solid var(--border);
    box-shadow:0 1px 4px rgba(45,106,79,.06);
  }
  .stat-label{font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  .stat-value{font-size:24px;font-weight:700;color:var(--ink)}
  .stat-card.accent{background:linear-gradient(135deg,var(--jade-pale),#e8f8ee)}
  .stat-card.accent .stat-value{color:var(--jade)}

  /* ── BUTTONS ── */
  .add-btn{
    width:100%;padding:17px;
    background:var(--bg-card);
    border:2px dashed var(--jade-light);
    border-radius:14px;
    color:var(--jade-mid);font-size:17px;font-weight:600;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:14px;
    transition:background .15s;
    font-family:'DM Sans',sans-serif;
  }
  .add-btn:active{background:var(--jade-faint)}
  .primary-btn{
    width:100%;padding:17px;
    background:linear-gradient(135deg,var(--jade) 0%,var(--jade-mid) 100%);
    color:#fff;border:none;border-radius:14px;
    font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;
    box-shadow:0 3px 10px rgba(45,106,79,.35);
    transition:opacity .15s,transform .1s;
    font-family:'DM Sans',sans-serif;
    letter-spacing:.01em;
  }
  .primary-btn:active{opacity:.88;transform:scale(.98)}
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .secondary-btn{
    width:100%;padding:17px;
    background:var(--bg-card);color:var(--jade);
    border:1.5px solid var(--jade-light);
    border-radius:14px;font-size:17px;font-weight:600;
    cursor:pointer;margin-top:10px;
    transition:background .15s;
    font-family:'DM Sans',sans-serif;
  }
  .secondary-btn:active{background:var(--jade-faint)}
  .danger-btn{
    width:100%;padding:17px;
    background:linear-gradient(135deg,#c0392b,#e74c3c);
    color:#fff;border:none;border-radius:14px;
    font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;
    box-shadow:0 3px 10px rgba(192,57,43,.3);
    font-family:'DM Sans',sans-serif;
  }
  .danger-btn:active{opacity:.88}
  .btn-row{display:flex;gap:8px;margin-top:10px}
  .btn-row .primary-btn,.btn-row .secondary-btn{margin-top:0}

  /* ── SAVE FILE FAB ── */
  .save-fab{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    z-index:90;
    background:linear-gradient(135deg,var(--jade) 0%,var(--jade-mid) 100%);
    color:#fff;border:none;border-radius:30px;
    padding:16px 32px;
    font-family:'DM Sans',sans-serif;
    font-size:17px;font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 20px rgba(45,106,79,.45);
    display:flex;align-items:center;gap:9px;
    transition:transform .15s,box-shadow .15s;
    white-space:nowrap;
  }
  .save-fab:active{transform:translateX(-50%) scale(.96);box-shadow:0 2px 10px rgba(45,106,79,.4)}
  .save-fab-icon{font-size:20px;line-height:1}

  /* ── AVATAR ── */
  .avatar{
    width:46px;height:46px;border-radius:50%;
    background:var(--jade-pale);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif SC',serif;
    font-size:15px;font-weight:700;color:var(--jade);flex-shrink:0;
    border:1.5px solid var(--jade-light);
  }
  .avatar.present{background:var(--jade);color:#fff;border-color:var(--jade)}

  /* ── CHECK CIRCLE ── */
  .check-circle{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;background:#fff;cursor:pointer;font-size:20px;
    transition:background .15s,border-color .15s;
  }
  .check-circle.checked{background:var(--jade);border-color:var(--jade);color:#fff}

  /* ── PILLS ── */
  .pill{
    font-size:13px;padding:8px 14px;border-radius:20px;
    border:1.5px solid var(--border);cursor:pointer;
    background:#fff;color:var(--ink-soft);white-space:nowrap;
    font-weight:600;transition:background .12s;
    font-family:'DM Sans',sans-serif;
  }
  .pill.paid{background:var(--jade-pale);color:var(--jade);border-color:var(--jade-light)}

  /* ── LABELS & BADGES ── */
  .section-label{
    font-size:12px;font-weight:700;color:var(--jade-mid);
    text-transform:uppercase;letter-spacing:.07em;margin:20px 0 10px 2px;
  }
  .owed-badge{
    font-size:13px;font-weight:600;
    background:var(--amber-pale);color:var(--amber);
    padding:5px 11px;border-radius:20px;white-space:nowrap;
    border:1px solid #fcd34d;
  }

  /* ── EMPTY STATE ── */
  .empty{text-align:center;padding:52px 20px;color:var(--ink-soft);font-size:17px;line-height:1.7}
  .empty-icon{font-size:44px;margin-bottom:12px}
  .empty strong{color:var(--jade-mid)}

  /* ── MODAL SHEET ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(15,20,30,.5);z-index:100;align-items:flex-end}
  .overlay.open{display:flex}
  .sheet{
    background:var(--bg-card);
    border-radius:22px 22px 0 0;
    padding:20px 20px 44px;
    width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 -4px 30px rgba(0,0,0,.18);
  }
  .sheet-handle{width:40px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 20px}
  .sheet h2{
    font-family:'Noto Serif SC',serif;
    font-size:22px;font-weight:700;margin-bottom:22px;color:var(--ink);
  }

  /* ── FORMS ── */
  .form-group{margin-bottom:18px}
  .form-label{
    font-size:14px;color:var(--jade-mid);margin-bottom:8px;
    display:block;font-weight:700;letter-spacing:.02em;
  }
  input[type=text],input[type=number],input[type=datetime-local],select,textarea{
    width:100%;padding:14px 16px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fff;color:var(--ink);
    font-size:17px;font-family:'DM Sans',sans-serif;
    -webkit-appearance:none;
    transition:border-color .15s;
  }
  textarea{resize:vertical;min-height:80px;font-size:16px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--jade-mid)}

  /* ── SESSION HEADER ── */
  .sess-header{
    padding:13px 16px;
    background:linear-gradient(to bottom,var(--jade-faint),var(--bg));
    border-bottom:1px solid var(--border);
  }

  /* ── MONTH BLOCKS ── */
  .month-block{background:var(--bg-card);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
  .month-hdr{
    padding:16px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(to right,var(--jade-faint),var(--bg-card));
  }
  .month-hdr h3{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:700;color:var(--ink)}
  .month-hdr p{font-size:14px;color:var(--ink-soft);margin-top:3px}
  .month-body{border-top:1px solid var(--bg);padding:12px 16px}
  .mrow{display:flex;justify-content:space-between;font-size:15px;padding:8px 0;border-bottom:1px solid var(--bg)}
  .mrow:last-child{border-bottom:none}

  /* ── BACKUP ── */
  .backup-card{
    background:var(--bg-card);border-radius:14px;border:1px solid var(--border);
    padding:18px;margin-bottom:14px;
    box-shadow:0 1px 6px rgba(45,106,79,.07);
  }
  .backup-card h3{
    font-family:'Noto Serif SC',serif;
    font-size:18px;font-weight:700;margin-bottom:7px;color:var(--ink);
  }
  .backup-card p{font-size:15px;color:var(--ink-soft);margin-bottom:16px;line-height:1.6}
  .export-btns{display:flex;flex-direction:column;gap:10px}
  .export-btn{
    padding:15px 16px;border-radius:12px;
    font-size:16px;font-weight:600;cursor:pointer;text-align:center;
    font-family:'DM Sans',sans-serif;
  }

  /* ── TOAST ── */
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;
    padding:12px 24px;border-radius:24px;font-size:16px;font-weight:500;
    white-space:nowrap;opacity:0;transition:opacity .25s;
    pointer-events:none;z-index:200;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1}

  /* ── HISTORY ROW ── */
  .hist-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--bg);font-size:15px;
  }
  .hist-row:last-child{border-bottom:none}

  .green{color:var(--jade)}
  .amber{color:var(--amber)}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast"></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"><div class="sheet-handle"></div><div id="sheet-content"></div></div>
</div>
<button class="save-fab" id="saveFab" onclick="exportFull()" title="Save backup file">
  <span class="save-fab-icon">💾</span> Save File
</button>

<script>
var S={sessions:[],students:[],attendance:{},facilities:[],tab:'today',sess:null,student:null,view:null,openMonths:{}};
var STORE_KEY='taiji-v2';

function load(){try{var d=localStorage.getItem(STORE_KEY);if(d){var p=JSON.parse(d);S.sessions=p.sessions||[];S.students=p.students||[];S.attendance=p.attendance||{};S.facilities=p.facilities||[];}}catch(e){}render();}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({sessions:S.sessions,students:S.students,attendance:S.attendance,facilities:S.facilities}));}catch(e){}}

function fmt(dt){return new Date(dt).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function fmtT(dt){return new Date(dt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function fmtM(dt){return new Date(dt).toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function mkey(dt){var d=new Date(dt);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ini(n){return n.trim().split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);}
function akey(sid){return 'at-'+sid;}
function gat(sid){return S.attendance[akey(sid)]||{};}
function nPresent(sid){return Object.values(gat(sid)).filter(function(v){return v.present;}).length;}
function fee(s){if(s.facilityId){var f=S.facilities.find(function(x){return x.id===s.facilityId;});if(f)return parseFloat(f.fee)||0;}return parseFloat(s.fee)||0;}
function collected(sid){var s=S.sessions.find(function(x){return x.id===sid;});if(!s)return 0;var f=fee(s);return Object.values(gat(sid)).filter(function(v){return v.present&&v.paid;}).length*f;}
function owed(sid){var s=S.sessions.find(function(x){return x.id===sid;});if(!s)return 0;return nPresent(sid)*fee(s);}
function stVisits(id){return S.sessions.filter(function(s){var a=gat(s.id);return a[id]&&a[id].present;}).length;}
function stPaid(id){return S.sessions.filter(function(s){var a=gat(s.id);return a[id]&&a[id].present&&a[id].paid;}).length;}
function stCollected(id){return S.sessions.reduce(function(sum,s){var a=gat(s.id);if(a[id]&&a[id].present&&a[id].paid)sum+=fee(s);return sum;},0);}
function stOwed(id){return S.sessions.reduce(function(sum,s){var a=gat(s.id);if(a[id]&&a[id].present&&!a[id].paid)sum+=fee(s);return sum;},0);}
function $m(v){return '$'+parseFloat(v||0).toFixed(2);}

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

function render(){
  if(S.student){renderStudent();return;}
  if(S.sess){renderSession();return;}
  if(S.view==='facilities'){renderFacilities();return;}
  if(S.view==='backup'){renderBackup();return;}
  renderMain();
}

function hdrBtns(){
  return '<div class="top-bar-btns">'
    +'<button class="hdr-btn" onclick="exportFull()" title="Save File"><span class="hdr-btn-icon">💾</span><span class="hdr-btn-label">Save</span></button>'
    +'<button class="hdr-btn" onclick="S.view=\'backup\';render()" title="Backup"><span class="hdr-btn-icon">📂</span><span class="hdr-btn-label">Backup</span></button>'
    +'<button class="hdr-btn" onclick="S.view=\'facilities\';render()" title="Facilities"><span class="hdr-btn-icon">🏛</span><span class="hdr-btn-label">Venues</span></button>'
    +'<button class="hdr-btn" onclick="showAddStudent()" title="Add student"><span class="hdr-btn-icon">＋👤</span><span class="hdr-btn-label">Student</span></button>'
    +'</div>';
}

function renderMain(){
  var now=new Date();
  var today=S.sessions.filter(function(s){return new Date(s.date).toDateString()===now.toDateString();});
  var past=S.sessions.filter(function(s){return new Date(s.date)<now&&new Date(s.date).toDateString()!==now.toDateString();}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var totC=S.sessions.reduce(function(sum,s){return sum+collected(s.id);},0);
  var totO=S.sessions.reduce(function(sum,s){return sum+owed(s.id);},0);

  var html='<div class="top-bar"><h1>☯ Taiji Attendance</h1>'+hdrBtns()+'</div>';

  html+='<div class="tab-bar">';
  var tabLabels={today:'Today',history:'History',students:'Students',summary:'Summary'};
  ['today','history','students','summary'].forEach(function(t){
    html+='<div class="tab'+(S.tab===t?' active':'')+'" onclick="switchTab(\''+t+'\')">'+tabLabels[t]+'</div>';
  });
  html+='</div><div class="content">';

  if(S.tab==='today'){
    html+='<div class="stat-grid">';
    html+='<div class="stat-card accent"><div class="stat-label">Collected</div><div class="stat-value">'+$m(totC)+'</div></div>';
    html+='<div class="stat-card"><div class="stat-label">Outstanding</div><div class="stat-value" style="color:'+(totO-totC>0?'var(--amber)':'var(--jade)')+'">'+$m(totO-totC)+'</div></div>';
    html+='</div>';
    html+='<button class="add-btn" onclick="showNewSession()"><span style="font-size:22px">＋</span> Start New Class Session</button>';
    if(today.length===0){
      html+='<div class="empty"><div class="empty-icon">🌅</div>No sessions today yet.<br><strong>Tap above to begin.</strong></div>';
    }
    today.forEach(function(s){
      html+='<div class="card"><div class="card-row" onclick="S.sess=\''+s.id+'\';render()">';
      html+='<div style="flex:1"><div class="card-title">'+s.name+'</div>';
      html+='<div class="card-sub">'+fmtT(s.date)+' · '+nPresent(s.id)+'/'+S.students.length+' present · '+$m(collected(s.id))+' collected</div></div>';
      html+='<span class="chevron">›</span></div></div>';
    });
  }

  if(S.tab==='history'){
    if(past.length===0){
      html+='<div class="empty"><div class="empty-icon">📅</div>No past sessions yet</div>';
    }
    past.forEach(function(s){
      html+='<div class="card"><div class="card-row" onclick="S.sess=\''+s.id+'\';render()">';
      html+='<div style="flex:1"><div class="card-title">'+s.name+'</div>';
      html+='<div class="card-sub">'+fmt(s.date)+' · '+nPresent(s.id)+'/'+S.students.length+' · '+$m(collected(s.id))+'/'+$m(owed(s.id))+'</div></div>';
      html+='<span class="chevron">›</span></div></div>';
    });
  }

  if(S.tab==='students'){
    if(S.students.length===0){
      html+='<div class="empty"><div class="empty-icon">🧘</div>No students yet.<br><strong>Tap ＋Student above to add one.</strong></div>';
    } else {
      html+='<div class="card">';
      S.students.forEach(function(st){
        html+='<div class="card-row" onclick="S.student=\''+st.id+'\';render()">';
        html+='<div class="avatar">'+ini(st.name)+'</div>';
        html+='<div style="flex:1;margin-left:12px"><div class="card-title">'+st.name+'</div>';
        html+='<div class="card-sub">'+stVisits(st.id)+' visits · '+$m(stCollected(st.id))+' paid</div></div>';
        if(stOwed(st.id)>0)html+='<span class="owed-badge">'+$m(stOwed(st.id))+' owed</span>';
        html+='<span class="chevron" style="margin-left:8px">›</span></div>';
      });
      html+='</div>';
    }
  }

  if(S.tab==='summary'){
    if(S.sessions.length===0){
      html+='<div class="empty"><div class="empty-icon">📊</div>No data yet</div>';
    } else {
      var byM={};
      S.sessions.forEach(function(s){var k=mkey(s.date);if(!byM[k])byM[k]={key:k,label:fmtM(s.date),sessions:[]};byM[k].sessions.push(s);});
      Object.values(byM).sort(function(a,b){return b.key.localeCompare(a.key);}).forEach(function(m){
        var totP=m.sessions.reduce(function(n,s){return n+nPresent(s.id);},0);
        var mc=m.sessions.reduce(function(n,s){return n+collected(s.id);},0);
        var mo=m.sessions.reduce(function(n,s){return n+owed(s.id);},0);
        var open=S.openMonths[m.key];
        html+='<div class="month-block">';
        html+='<div class="month-hdr" onclick="S.openMonths[\''+m.key+'\']=!S.openMonths[\''+m.key+'\'];render()">';
        html+='<div><h3>'+m.label+'</h3><p>'+m.sessions.length+' sessions · '+$m(mc)+' collected</p></div>';
        html+='<span style="color:var(--jade-mid);font-size:22px">'+(open?'⌄':'⌃')+'</span></div>';
        if(open){
          html+='<div class="month-body">';
          html+='<div class="mrow"><span style="color:var(--ink-soft)">Sessions</span><span>'+m.sessions.length+'</span></div>';
          html+='<div class="mrow"><span style="color:var(--ink-soft)">Total attendance</span><span>'+totP+'</span></div>';
          html+='<div class="mrow"><span style="color:var(--ink-soft)">Fees owed</span><span>'+$m(mo)+'</span></div>';
          html+='<div class="mrow"><span style="color:var(--ink-soft)">Collected</span><span class="green">'+$m(mc)+'</span></div>';
          html+='<div class="mrow"><span style="color:var(--ink-soft)">Outstanding</span><span class="'+(mo-mc>0?'amber':'green')+'">'+$m(mo-mc)+'</span></div>';
          html+='<div class="section-label">Sessions this month</div>';
          m.sessions.sort(function(a,b){return new Date(b.date)-new Date(a.date);}).forEach(function(s){
            html+='<div class="mrow" style="cursor:pointer" onclick="S.sess=\''+s.id+'\';render()"><span>'+fmt(s.date)+' · '+s.name+'</span><span style="color:var(--jade)">'+$m(collected(s.id))+'</span></div>';
          });
          html+='</div>';
        }
        html+='</div>';
      });
    }
  }

  html+='</div>';
  document.getElementById('app').innerHTML=html;
}

function renderSession(){
  var s=S.sessions.find(function(x){return x.id===S.sess;});
  if(!s){S.sess=null;render();return;}
  var a=gat(s.id);var f=fee(s);
  var fac=s.facilityId?S.facilities.find(function(x){return x.id===s.facilityId;}):null;

  var html='<div class="top-bar">';
  html+='<button class="icon-btn" onclick="S.sess=null;render()">‹ Back</button>';
  html+='<h1 style="font-size:16px;flex:1;text-align:center;padding:0 8px">'+s.name+'</h1>';
  html+='<button class="icon-btn" onclick="showEditSession(\''+s.id+'\')">✎ Edit</button></div>';

  html+='<div class="sess-header">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  html+='<span style="font-size:14px;color:var(--ink-soft);font-weight:500">'+fmt(s.date)+' · '+fmtT(s.date)+'</span>';
  html+='<button class="pill" onclick="markAll(\''+s.id+'\')">✓ Mark all present</button></div>';
  html+='<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:600">';
  if(fac)html+='<span style="color:var(--ink-soft)">🏛 '+fac.name+'</span>';
  html+='<span style="color:var(--ink-soft)">Fee: '+$m(f)+'/person</span>';
  html+='<span class="green">'+$m(collected(s.id))+' collected</span>';
  if(owed(s.id)-collected(s.id)>0)html+='<span class="amber">'+$m(owed(s.id)-collected(s.id))+' owed</span>';
  html+='</div></div>';

  html+='<div class="content">';
  if(S.students.length===0)html+='<div class="empty">Add students first</div>';
  html+='<div class="card">';
  S.students.forEach(function(st){
    var rec=a[st.id]||{};var present=!!rec.present;var paid=!!rec.paid;
    html+='<div style="display:flex;align-items:center;padding:15px 16px;border-bottom:1px solid var(--bg);gap:12px">';
    html+='<div class="avatar'+(present?' present':'')+'">'+ini(st.name)+'</div>';
    html+='<div style="flex:1"><div style="font-size:17px;font-weight:600;color:var(--ink);margin-bottom:5px">'+st.name+'</div>';
    if(present)html+='<button class="pill'+(paid?' paid':'')+'" onclick="togglePaid(\''+s.id+'\',\''+st.id+'\')">'+(paid?'✓ '+(f>0?$m(f)+' ':'')+'Paid':'Mark '+(f>0?$m(f)+' ':'')+'Paid')+'</button>';
    html+='</div>';
    html+='<div class="check-circle'+(present?' checked':'')+'" onclick="togglePresent(\''+s.id+'\',\''+st.id+'\')">'+(present?'✓':'')+'</div>';
    html+='</div>';
  });
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
}

function renderStudent(){
  var st=S.students.find(function(x){return x.id===S.student;});
  if(!st){S.student=null;render();return;}
  var hist=S.sessions.filter(function(s){var a=gat(s.id);return a[st.id]&&a[st.id].present;}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  var html='<div class="top-bar">';
  html+='<button class="icon-btn" onclick="S.student=null;S.tab=\'students\';render()">‹ Back</button>';
  html+='<h1 style="font-size:16px;flex:1;text-align:center">'+st.name+'</h1>';
  html+='<button class="icon-btn" style="background:rgba(255,100,80,.2);border-color:rgba(255,100,80,.5)" onclick="confirmDelete(\''+st.id+'\')">🗑 Remove</button></div>';

  html+='<div class="content">';
  html+='<div class="stat-grid">';
  html+='<div class="stat-card accent"><div class="stat-label">Total visits</div><div class="stat-value">'+stVisits(st.id)+'</div></div>';
  html+='<div class="stat-card"><div class="stat-label">Paid sessions</div><div class="stat-value">'+stPaid(st.id)+'</div></div>';
  html+='<div class="stat-card accent"><div class="stat-label">Collected</div><div class="stat-value" style="font-size:20px">'+$m(stCollected(st.id))+'</div></div>';
  html+='<div class="stat-card"><div class="stat-label">Outstanding</div><div class="stat-value" style="font-size:20px;color:'+(stOwed(st.id)>0?'var(--amber)':'var(--jade)')+'">'+$m(stOwed(st.id))+'</div></div>';
  html+='</div>';
  if(st.notes)html+='<div style="background:var(--jade-faint);border-radius:10px;padding:13px 15px;font-size:15px;color:var(--jade-mid);margin-bottom:4px;border:1px solid var(--jade-pale)">📝 '+st.notes+'</div>';
  html+='<div class="section-label">Attendance history</div>';
  html+='<div class="card" style="padding:0 16px">';
  if(hist.length===0)html+='<div style="padding:20px 0;text-align:center;font-size:15px;color:var(--ink-soft)">No attendance yet</div>';
  hist.forEach(function(s){
    var rec=gat(s.id)[st.id]||{};var f=fee(s);
    html+='<div class="hist-row"><span style="color:var(--ink-mid)">'+fmt(s.date)+' · '+s.name+'</span>';
    html+='<span class="'+(rec.paid?'green':'amber')+'">'+(rec.paid?'✓ '+$m(f):$m(f)+' owed')+'</span></div>';
  });
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
}

function renderFacilities(){
  var html='<div class="top-bar">';
  html+='<button class="icon-btn" onclick="S.view=null;render()">‹ Back</button>';
  html+='<h1>Venues &amp; Fees</h1>';
  html+='<button class="icon-btn" onclick="showAddFacility()">＋ Add</button></div>';
  html+='<div class="content">';
  if(S.facilities.length===0){
    html+='<div class="empty"><div class="empty-icon">🏛</div>No venues yet.<br><strong>Tap + Add to create one.</strong></div>';
  } else {
    html+='<div class="card">';
    S.facilities.forEach(function(f){
      html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--bg)">';
      html+='<div><div style="font-size:17px;font-weight:600;color:var(--ink)">'+f.name+'</div>';
      html+='<div style="font-size:14px;color:var(--jade-mid);margin-top:3px">'+$m(f.fee)+' per student</div></div>';
      html+='<div style="display:flex;gap:10px">';
      html+='<button class="icon-btn dark" onclick="showEditFacility(\''+f.id+'\')">✎ Edit</button>';
      html+='<button class="icon-btn" style="background:rgba(192,57,43,.1);border-color:#f5c6c3;color:var(--red)" onclick="delFacility(\''+f.id+'\')">🗑</button>';
      html+='</div></div>';
    });
    html+='</div>';
  }
  html+='</div>';
  document.getElementById('app').innerHTML=html;
}

function renderBackup(){
  var has=S.students.length>0||S.sessions.length>0;
  var html='<div class="top-bar">';
  html+='<button class="icon-btn" onclick="S.view=null;render()">‹ Back</button>';
  html+='<h1>Backup &amp; Restore</h1><div></div></div>';
  html+='<div class="content">';
  html+='<div class="backup-card">';
  html+='<h3>💾 Export</h3>';
  html+='<p>Save your data outside the app. Full backup can be used to restore everything.</p>';
  html+='<div class="export-btns">';
  html+='<button class="export-btn primary-btn" onclick="exportFull()" '+(has?'':'disabled')+'>Full backup (JSON) — recommended</button>';
  html+='<button class="export-btn secondary-btn" onclick="exportAttendance()" '+(has?'':'disabled')+'>Attendance records (CSV)</button>';
  html+='<button class="export-btn secondary-btn" onclick="exportStudents()" '+(has?'':'disabled')+'>Student roster (CSV)</button>';
  html+='</div></div>';
  html+='<div class="backup-card">';
  html+='<h3>📥 Restore</h3>';
  html+='<p>Paste the contents of a JSON backup file below. This replaces all current data.</p>';
  html+='<textarea id="restoreBox" placeholder="Paste JSON backup here..."></textarea>';
  html+='<div class="btn-row"><button class="secondary-btn" onclick="document.getElementById(\'restoreBox\').value=\'\'">Clear</button><button class="primary-btn" onclick="doRestore()">Restore</button></div>';
  html+='</div>';
  html+='<div style="background:var(--jade-faint);border:1px solid var(--jade-pale);border-radius:12px;padding:15px;font-size:15px;color:var(--jade);line-height:1.6">';
  html+='<strong>💡 Tip:</strong> Use the <strong>Save</strong> button (top-right or bottom of screen) after every class to download a backup to iCloud Drive or email it to yourself.';
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
}

function switchTab(t){S.tab=t;S.view=null;S.sess=null;S.student=null;render();}

function togglePresent(sid,stid){
  if(!S.attendance[akey(sid)])S.attendance[akey(sid)]={};
  var cur=S.attendance[akey(sid)][stid]||{};
  S.attendance[akey(sid)][stid]=cur.present?{present:false,paid:false}:{present:true,paid:false};
  save();renderSession();
}
function togglePaid(sid,stid){
  if(!S.attendance[akey(sid)])S.attendance[akey(sid)]={};
  var cur=S.attendance[akey(sid)][stid]||{};
  S.attendance[akey(sid)][stid]=Object.assign({},cur,{paid:!cur.paid});
  save();renderSession();
}
function markAll(sid){
  if(!S.attendance[akey(sid)])S.attendance[akey(sid)]={};
  S.students.forEach(function(st){
    if(!S.attendance[akey(sid)][st.id])S.attendance[akey(sid)][st.id]={present:true,paid:false};
    else S.attendance[akey(sid)][st.id].present=true;
  });
  save();renderSession();
}

function showNewSession(){
  var now=new Date();var ds=now.toISOString().slice(0,16);
  var fops=S.facilities.map(function(f){return '<option value="'+f.id+'">'+f.name+' ('+$m(f.fee)+')</option>';}).join('');
  var html='<h2>New Class Session</h2>';
  html+='<div class="form-group"><label class="form-label">Session name</label><input id="sn" type="text" value="Taiji class"></div>';
  html+='<div class="form-group"><label class="form-label">Date &amp; time</label><input id="sd" type="datetime-local" value="'+ds+'"></div>';
  if(S.facilities.length>0){html+='<div class="form-group"><label class="form-label">Venue</label><select id="sf" onchange="toggleFeeField()"><option value="">— custom fee —</option>'+fops+'</select></div>';}
  html+='<div class="form-group" id="feeGrp"><label class="form-label">Fee per student ($)</label><input id="sf2" type="number" min="0" step="0.50" placeholder="0.00"></div>';
  html+='<button class="primary-btn" onclick="createSession()">Start Session</button>';
  html+='<button class="secondary-btn" onclick="closeSheet()">Cancel</button>';
  openSheet(html);
}
function toggleFeeField(){var el=document.getElementById('sf');var grp=document.getElementById('feeGrp');if(el&&grp)grp.style.display=el.value?'none':'block';}
function showEditSession(sid){
  var s=S.sessions.find(function(x){return x.id===sid;});if(!s)return;
  var ds=new Date(s.date).toISOString().slice(0,16);
  var fops=S.facilities.map(function(f){return '<option value="'+f.id+'"'+(s.facilityId===f.id?' selected':'')+'>'+f.name+' ('+$m(f.fee)+')</option>';}).join('');
  var html='<h2>Edit Session</h2>';
  html+='<div class="form-group"><label class="form-label">Session name</label><input id="sn" type="text" value="'+s.name+'"></div>';
  html+='<div class="form-group"><label class="form-label">Date &amp; time</label><input id="sd" type="datetime-local" value="'+ds+'"></div>';
  if(S.facilities.length>0){html+='<div class="form-group"><label class="form-label">Venue</label><select id="sf" onchange="toggleFeeField()"><option value="">— custom fee —</option>'+fops+'</select></div>';}
  html+='<div class="form-group" id="feeGrp" style="'+(s.facilityId?'display:none':'')+'"><label class="form-label">Fee per student ($)</label><input id="sf2" type="number" min="0" step="0.50" value="'+(s.fee||0)+'"></div>';
  html+='<button class="primary-btn" onclick="updateSession(\''+sid+'\')">Save Changes</button>';
  html+='<button class="secondary-btn" onclick="closeSheet()">Cancel</button>';
  openSheet(html);
}
function createSession(){
  var name=(document.getElementById('sn').value||'').trim()||'Taiji class';
  var date=document.getElementById('sd').value;if(!date)return;
  var sfEl=document.getElementById('sf');var facId=sfEl?sfEl.value:'';
  var f=facId?0:parseFloat((document.getElementById('sf2')||{}).value)||0;
  var id='s'+Date.now();
  S.sessions.push({id:id,name:name,date:new Date(date).toISOString(),facilityId:facId,fee:f});
  save();closeSheet();S.sess=id;render();
}
function updateSession(sid){
  var s=S.sessions.find(function(x){return x.id===sid;});if(!s)return;
  s.name=(document.getElementById('sn').value||'').trim()||s.name;
  s.date=new Date(document.getElementById('sd').value).toISOString();
  var sfEl=document.getElementById('sf');s.facilityId=sfEl?sfEl.value:'';
  s.fee=s.facilityId?0:parseFloat((document.getElementById('sf2')||{}).value)||0;
  save();closeSheet();renderSession();
}

function showAddStudent(){
  var html='<h2>Add Student</h2>';
  html+='<div class="form-group"><label class="form-label">Full name</label><input id="stN" type="text" placeholder="Student name"></div>';
  html+='<div class="form-group"><label class="form-label">Notes (optional)</label><input id="stX" type="text" placeholder="e.g. beginner, Tues/Thu"></div>';
  html+='<button class="primary-btn" onclick="addStudent()">Add Student</button>';
  html+='<button class="secondary-btn" onclick="closeSheet()">Cancel</button>';
  openSheet(html);
}
function addStudent(){
  var name=(document.getElementById('stN').value||'').trim();if(!name)return;
  S.students.push({id:'t'+Date.now(),name:name,notes:(document.getElementById('stX').value||'').trim()});
  save();closeSheet();render();
}
function confirmDelete(id){
  var st=S.students.find(function(x){return x.id===id;});if(!st)return;
  var html='<h2>Remove Student?</h2>';
  html+='<p style="color:var(--ink-soft);font-size:16px;margin-bottom:16px;line-height:1.6">This will remove <strong>'+st.name+'</strong> from the roster. Their attendance history is kept.</p>';
  html+='<button class="danger-btn" onclick="delStudent(\''+id+'\')">Remove '+st.name+'</button>';
  html+='<button class="secondary-btn" onclick="closeSheet()">Cancel</button>';
  openSheet(html);
}
function delStudent(id){
  S.students=S.students.filter(function(x){return x.id!==id;});
  S.student=null;save();closeSheet();S.tab='students';render();
}

function showAddFacility(){
  var html='<h2>Add Venue</h2>';
  html+='<div class="form-group"><label class="form-label">Venue name</label><input id="fn" type="text" placeholder="e.g. Community center"></div>';
  html+='<div class="form-group"><label class="form-label">Default fee per student ($)</label><input id="ff" type="number" min="0" step="0.50" placeholder="10.00"></div>';
  html+='<button class="primary-btn" onclick="addFacility()">Add Venue</button>';
  html+='<button class="secondary-btn" onclick="closeSheet()">Cancel</button>';
  openSheet(html);
}
function showEditFacility(id){
  var f=S.facilities.find(function(x){return x.id===id;});if(!f)return;
  var html='<h2>Edit Venue</h2>';
  html+='<div class="form-group"><label class="form-label">Venue name</label><input id="fn" type="text" value="'+f.name+'"></div>';
  html+='<div class="form-group"><label class="form-label">Default fee per student ($)</label><input id="ff" type="number" min="0" step="0.50" value="'+f.fee+'"></div>';
  html+='<button class="primary-btn" onclick="editFacility(\''+id+'\')">Save Changes</button>';
  html+='<button class="secondary-btn" onclick="closeSheet()">Cancel</button>';
  openSheet(html);
}
function addFacility(){
  var name=(document.getElementById('fn').value||'').trim();if(!name)return;
  S.facilities.push({id:'f'+Date.now(),name:name,fee:parseFloat(document.getElementById('ff').value)||0});
  save();closeSheet();renderFacilities();
}
function editFacility(id){
  var f=S.facilities.find(function(x){return x.id===id;});if(!f)return;
  f.name=(document.getElementById('fn').value||'').trim()||f.name;
  f.fee=parseFloat(document.getElementById('ff').value)||0;
  save();closeSheet();renderFacilities();
}
function delFacility(id){
  S.facilities=S.facilities.filter(function(x){return x.id!==id;});
  S.sessions.forEach(function(s){if(s.facilityId===id)s.facilityId='';});
  save();renderFacilities();
}

function csvEsc(v){var s=String(v==null?'':v);return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s;}
function dlFile(name,content,type){
  var b=new Blob([content],{type:type});var u=URL.createObjectURL(b);
  var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(u);
}
function exportFull(){
  var d={exportedAt:new Date().toISOString(),students:S.students,sessions:S.sessions,attendance:S.attendance,facilities:S.facilities};
  dlFile('taiji-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(d,null,2),'application/json');
  toast('✓ Full backup downloaded!');
}
function exportAttendance(){
  var rows=[['Date','Session','Facility','Fee','Student','Present','Paid','Amount paid']];
  S.sessions.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);}).forEach(function(s){
    var fac=s.facilityId?S.facilities.find(function(x){return x.id===s.facilityId;}):null;
    var f=fee(s);var a=gat(s.id);
    S.students.forEach(function(st){
      var r=a[st.id]||{};
      rows.push([fmt(s.date),s.name,fac?fac.name:'',f.toFixed(2),st.name,r.present?'Yes':'No',r.paid?'Yes':'No',(r.present&&r.paid?f:0).toFixed(2)]);
    });
  });
  dlFile('taiji-attendance-'+new Date().toISOString().slice(0,10)+'.csv',rows.map(function(r){return r.map(csvEsc).join(',');}).join('\n'),'text/csv');
  toast('✓ Attendance CSV downloaded!');
}
function exportStudents(){
  var rows=[['Name','Notes','Total visits','Paid sessions','Collected','Outstanding']];
  S.students.forEach(function(st){rows.push([st.name,st.notes||'',stVisits(st.id),stPaid(st.id),stCollected(st.id).toFixed(2),stOwed(st.id).toFixed(2)]);});
  dlFile('taiji-students-'+new Date().toISOString().slice(0,10)+'.csv',rows.map(function(r){return r.map(csvEsc).join(',');}).join('\n'),'text/csv');
  toast('✓ Student roster CSV downloaded!');
}
function doRestore(){
  var raw=(document.getElementById('restoreBox').value||'').trim();
  if(!raw){toast('Nothing to restore');return;}
  try{
    var d=JSON.parse(raw);
    if(!d.students||!d.sessions){toast('Invalid backup file');return;}
    S.students=d.students||[];S.sessions=d.sessions||[];S.attendance=d.attendance||{};S.facilities=d.facilities||[];
    save();toast('✓ Restored successfully!');
    setTimeout(function(){S.view=null;render();},1200);
  }catch(e){toast('Could not read file — check it and try again');}
}

function openSheet(html){document.getElementById('sheet-content').innerHTML=html;document.getElementById('overlay').classList.add('open');}
function closeSheet(){document.getElementById('overlay').classList.remove('open');}

load();
</script>
</body>
</html>
